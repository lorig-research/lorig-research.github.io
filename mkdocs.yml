site_name: Lo-Rig
site_description: Describing and promoting the endangered Monkha and Gongduk languages of Bhutan.
site_url: https://lorig-research.github.io/
repo_url: https://github.com/lorig-research/lorig-research.github.io/
repo_name: lorig-research.github.io

copyright: >
  Funded by the European Union. This work is supported by an ERC grant
  (Lo-Rig, 101162166). Views and opinions expressed are however those of
  the author(s) only and do not necessarily reflect those of the European
  Union or the European Research Council. Neither the European Union nor
  the granting authority can be held responsible for them.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  logo: assets/logos/logo-lo-rig_white.png
  favicon: assets/logos/favicon-32x32.png

  custom_dir: overrides

plugins:
  - search
  # Optional but recommended for “proof of work” updates:
  - blog:
      archive: true
      authors: 
      authors_file: "{blog}/.authors.yml"
      blog_dir: updates
      blog_toc: true
      categories: true
      categories_name: Categories
      post_date_format: long
      post_url_date_format: yyyy/MM/dd
  - tags:
      enabled: true
      
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - About:
      - Overview: about/overview.md
      - Team: about/team.md
      - Partners & Funders: about/partners_funders.md
  - Research:
      - Languages: research/languages.md
      - Methods & Data: research/methods_data.md
      - Outputs: research/outputs.md
  - Community:
      - Overview: community/overview.md
      - Monpa Community: community/monpa_community.md
      - Gongduk Community: community/gongduk_community.md
      - Engagement: community/engagement.md
  - Outputs:
      - Awards & Grants: outputs/awards_grants.md
      - Publications: outputs/publications.md
      - Talks & Posters: outputs/talks_posters.md
  - Project Updates:
      - Blog: updates/index.md
  - Resources:
      - Data & Materials: resources/data_materials.md
      - Downloads: resources/downloads.md
      - Contact: resources/contact.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/lorig_research
      name: Lo-Rig on X
    - icon: fontawesome/brands/github
      link: https://github.com/lorig-research/lorig-research.github.io
      name: Lo-Rig on GitHub